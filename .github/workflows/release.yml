name: Publish Linux installer
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Check release version
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open('Cargo.toml', 'rb') as file:
              version = tomllib.load(file)['package']['version']
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version
          PY
      - name: Install desktop build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev libegl1-mesa-dev
      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: python3 scripts/test-installer.py
      - run: cargo build --locked --release
      - name: Package and smoke-test executable
        run: |
          ./target/release/omascripture --version
          ./scripts/package-release.sh
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "OmaScripture $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$GITHUB_REF_NAME" dist/omascripture-linux-x86_64.tar.gz dist/omascripture-linux-x86_64.tar.gz.sha256 --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
